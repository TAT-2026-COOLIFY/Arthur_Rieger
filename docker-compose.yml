version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tcg_backend
    restart: always
    # Removemos a linha 'ports' do backend porque o front-end conversa 
    # com ele pela rede interna do docker através de http://backend:8000
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/tcg_shop.db

  frontend:
    build: ./frontend
    container_name: tcg_frontend
    restart: always
    ports:
      - "8501:8501" # Mantemos apenas o Streamlit para você acessar a interface web
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data: