version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tcg_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/tcg_shop.db

  frontend:
    build: ./frontend
    container_name: tcg_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data: